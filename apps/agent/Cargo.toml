[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[lib]
name = "agent"
path = "src/lib.rs"

[[bin]]
name = "agent"
path = "src/main.rs"

[[bench]]
name = "telemetry_hotpath"
harness = false

[dependencies]
tokio = { version = "1", features = ["full"] }
nvml-wrapper = { version = "0.8", optional = true }
async-nats = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["nvml"]
nvml = ["nvml-wrapper"]
