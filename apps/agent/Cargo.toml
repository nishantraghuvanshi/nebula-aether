[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
nvml-wrapper = { version = "0.8", optional = true }
async-nats = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
reqwest = { version = "0.11", features = ["json"] }

[features]
default = ["nvml"]
nvml = ["nvml-wrapper"]
